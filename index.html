  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F1F5F9;
      color: #0F172A;
    }
    .font-sport {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.02em;
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.18); }
    }
    .live-dot {
      animation: pulseLive 1.4s infinite ease-in-out;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .crop-grid {
      background-image:
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#009EE3] selection:text-white">

  <!-- ENCABEZADO INSTITUCIONAL (IDENTIDAD CELESTE Y BLANCA - TEMPERLEY)     -->
  <!-- ===================================================================== -->
  <header class="bg-[#0F172A] text-white border-b-4 border-[#009EE3] sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3">

        <div class="flex items-center gap-3.5 min-w-0">

          <button
            id="header-crest-btn"
            type="button"
            onclick="handleSecretTriggerTap()"
            title="Club Atlético Temperley"
            class="shrink-0 focus:outline-none active:scale-95 transition-transform rounded-xl flex items-center justify-center"
          >
            <!-- Se renderiza dinámicamente con el tamaño configurado -->
          </button>

          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#009EE3] text-white">
                Club Atlético Temperley
              </span>
            </div>
            <h1 class="font-sport text-xl sm:text-3xl font-bold uppercase tracking-tight text-white truncate mt-0.5">
              Copa Centenario
            </h1>
            <p class="text-xs text-slate-300 truncate">
              Torneo de socios
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <div id="live-header-badge" class="hidden shrink-0 items-center gap-1.5 px-2.5 py-1 rounded-full bg-red-500/20 border border-red-400/40 text-red-200 text-xs font-bold">
            <span class="w-2 h-2 rounded-full bg-red-400 live-dot"></span>
            <span>EN VIVO</span>
          </div>
        </div>
      </div>

      <!-- Navegación Principal (Solo vistas públicas; Admin aparece únicamente al autenticarse) -->
      <nav id="main-nav" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5 md:pb-0"></nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL DE LA APLICACIÓN                                  -->
  <!-- ===================================================================== -->

  <!-- ===================================================================== -->
  <!-- PIE DE PÁGINA INSTITUCIONAL                                           -->
  <!-- ===================================================================== -->

          class="p-1.5 rounded-lg text-slate-600 hover:text-slate-400 transition-colors"

        </button>
      </div>
    </div>
  </footer>

    async function saveTournamentData({ saveMain = true, teamId = null, saveAllTeams = false } = {}) {
      if (!currentUser || !db || isApplyingRemoteUpdate) return;

      try {
        const ops = [];

        if (saveMain) {
          ops.push(
            setDoc(getMainDocRef(), {
              matches: tournamentData.matches,
              customHeaderCrestUrl: tournamentData.customHeaderCrestUrl || null,
              imageSettings: tournamentData.imageSettings,
              updatedAt: Date.now()
            })
          );
        }

        if (saveAllTeams) {
          tournamentData.teams.forEach((team, idx) => {
            ops.push(
              setDoc(getTeamDocRef(team.id), {
                ...team,
                orderIndex: idx
              })
            );
          });
        } else if (teamId) {
          const idx = tournamentData.teams.findIndex(t => t.id === teamId);
          if (idx !== -1) {
            ops.push(
              setDoc(getTeamDocRef(teamId), {
                ...tournamentData.teams[idx],
                orderIndex: idx
              })
            );
          }
        }

        await Promise.all(ops);
      } catch (e) {
        console.error('Error al guardar cambios en la nube:', e);
        showToast('No se pudo sincronizar el cambio. Verificá tu conexión.', 'error');
      }
    }

    async function initCloudSync() {
      try {
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          firebaseConfig = JSON.parse(__firebase_config);
        } else if (MANUAL_FIREBASE_CONFIG && MANUAL_FIREBASE_CONFIG.apiKey && MANUAL_FIREBASE_CONFIG.projectId) {
          firebaseConfig = MANUAL_FIREBASE_CONFIG;
        }

        if (!firebaseConfig) {
          uiState.cloudStatus = 'offline';
          return;
        }

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Autenticación obligatoria antes de cualquier lectura o escritura
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        onAuthStateChanged(auth, (user) => {
          currentUser = user;
        });

        if (!currentUser) {
          uiState.cloudStatus = 'error';
          return;
        }

        // Inicializar datos públicos si el torneo aún no existe en la nube
        const mainSnap = await getDoc(getMainDocRef());
        if (!mainSnap.exists()) {
          await saveTournamentData({ saveMain: true, saveAllTeams: true });
        }

        // Escucha en vivo del estado principal (partidos, resultados, logo y escalas)
        onSnapshot(
          getMainDocRef(),
          (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              isApplyingRemoteUpdate = true;
              if (Array.isArray(data.matches)) {
                tournamentData.matches = data.matches;
              }
              if (typeof data.customHeaderCrestUrl !== 'undefined') {
                tournamentData.customHeaderCrestUrl = data.customHeaderCrestUrl;
              }
              if (data.imageSettings) {
                tournamentData.imageSettings = data.imageSettings;
              }
              uiState.cloudStatus = 'synced';
              renderApp();
              isApplyingRemoteUpdate = false;
            }
          },
          (error) => {
            console.error('Error en suscripción de partidos:', error);
            uiState.cloudStatus = 'error';
          }
        );

        // Escucha en vivo de los equipos (nombres, escudos y fotos de socios)
        onSnapshot(
          getTeamsCollectionRef(),
          (querySnap) => {
            if (!querySnap.empty) {
              const remoteTeams = [];
              querySnap.forEach((d) => {
                remoteTeams.push(d.data());
              });
              remoteTeams.sort((a, b) => (a.orderIndex ?? 99) - (b.orderIndex ?? 99));

              isApplyingRemoteUpdate = true;
              tournamentData.teams = remoteTeams;
              uiState.cloudStatus = 'synced';
              renderApp();
              isApplyingRemoteUpdate = false;
            }
          },
          (error) => {
            console.error('Error en suscripción de equipos:', error);
            uiState.cloudStatus = 'error';
          }
        );
      } catch (err) {
        console.error('Error inicializando sincronización:', err);
        uiState.cloudStatus = 'error';
      }
    }

    // -------------------------------------------------------------------
    // 4. LÓGICA DE POSICIONES (5 GRUPOS DE 3 + MEJORES SEGUNDOS + CRUCES)
    // -------------------------------------------------------------------
    function computeGroupStandings(groupLetter) {
      const groupTeams = tournamentData.teams.filter(t => t.group === groupLetter);
      const statsMap = {};

      groupTeams.forEach(t => {
        statsMap[t.id] = {
          team: t,
          pj: 0,
          pg: 0,
          pe: 0,
          pp: 0,
          gf: 0,
          gc: 0,
          dif: 0,
          pts: 0
        };
      });

      const groupMatches = tournamentData.matches.filter(
        m => m.stage === 'GROUP' && m.group === groupLetter && m.status === 'FINISHED' && m.homeGoals !== null && m.awayGoals !== null
      );

      groupMatches.forEach(m => {
        const home = statsMap[m.homeId];
        const away = statsMap[m.awayId];
        if (!home || !away) return;

        home.pj += 1;
        away.pj += 1;
        home.gf += m.homeGoals;
        home.gc += m.awayGoals;
        away.gf += m.awayGoals;
        away.gc += m.homeGoals;

        if (m.homeGoals > m.awayGoals) {
          home.pg += 1;
          home.pts += 3;
          away.pp += 1;
        } else if (m.homeGoals < m.awayGoals) {
          away.pg += 1;
          away.pts += 3;
          home.pp += 1;
        } else {
          home.pe += 1;
          away.pe += 1;
          home.pts += 1;
          away.pts += 1;
        }
      });

      const list = Object.values(statsMap).map(s => ({
        ...s,
        dif: s.gf - s.gc
      }));

      // Desempate: 1) Puntos, 2) Dif Gol, 3) Goles a Favor, 4) Enfrentamiento directo
      list.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.dif !== a.dif) return b.dif - a.dif;
        if (b.gf !== a.gf) return b.gf - a.gf;

        const h2h = groupMatches.find(
          m => (m.homeId === a.team.id && m.awayId === b.team.id) || (m.homeId === b.team.id && m.awayId === a.team.id)
        );
        if (h2h) {
          const aGoals = h2h.homeId === a.team.id ? h2h.homeGoals : h2h.awayGoals;
          const bGoals = h2h.homeId === b.team.id ? h2h.homeGoals : h2h.awayGoals;
          if (bGoals !== aGoals) return bGoals - aGoals;
        }
        return a.team.name.localeCompare(b.team.name);
      });

      return list;
    }

    function getExpectedGroupMatchesCount(groupLetter) {
      const n = tournamentData.teams.filter(t => t.group === groupLetter).length;
      if (n < 2) return 1;
      return (n * (n - 1)) / 2;
    }

    // Verifica si un grupo completó todos sus partidos
    function isGroupCompleted(groupLetter) {
      const groupMatches = tournamentData.matches.filter(m => m.stage === 'GROUP' && m.group === groupLetter);
      const expected = getExpectedGroupMatchesCount(groupLetter);
      return groupMatches.length >= expected && groupMatches.every(m => m.status === 'FINISHED');
    }

    function isAllGroupsCompleted() {
      return TOURNAMENT_GROUPS.every(g => isGroupCompleted(g));
    }

    // Tabla de Mejores Segundos (entre los 5 grupos A, B, C, D, E)
    function computeBestSeconds() {
      const seconds = [];
      TOURNAMENT_GROUPS.forEach(g => {
        const stand = computeGroupStandings(g);
        if (stand[1]) {
          seconds.push({
            ...stand[1],
            group: g,
            groupCompleted: isGroupCompleted(g)
          });
        }
      });

      seconds.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.dif !== a.dif) return b.dif - a.dif;
        if (b.gf !== a.gf) return b.gf - a.gf;
        if (b.pg !== a.pg) return b.pg - a.pg;
        return a.team.name.localeCompare(b.team.name);
      });

      return seconds;
    }

    function getMatchWinnerId(match) {
      if (!match || match.status !== 'FINISHED' || match.homeGoals === null || match.awayGoals === null) return null;
      if (match.homeGoals > match.awayGoals) return match.homeId;
      if (match.awayGoals > match.homeGoals) return match.awayId;
      if (match.homePen !== null && match.awayPen !== null) {
        if (match.homePen > match.awayPen) return match.homeId;
        if (match.awayPen > match.homePen) return match.awayId;
      }
      return null;
    }

    function syncKnockoutBracket() {
      const standA = computeGroupStandings('A');
      const standB = computeGroupStandings('B');
      const standC = computeGroupStandings('C');
      const standD = computeGroupStandings('D');
      const standE = computeGroupStandings('E');
      const bestSeconds = computeBestSeconds();
      const allGroupsDone = isAllGroupsCompleted();

      const qf1 = tournamentData.matches.find(m => m.id === 'qf1');
      const qf2 = tournamentData.matches.find(m => m.id === 'qf2');
      const qf3 = tournamentData.matches.find(m => m.id === 'qf3');
      const qf4 = tournamentData.matches.find(m => m.id === 'qf4');

      // Cada grupo solo define su clasificado cuando TODOS los partidos de ese grupo están finalizados
      if (qf1) {
        qf1.homeId = isGroupCompleted('A') ? (standA[0]?.team.id || null) : null;
        qf1.awayId = allGroupsDone ? (bestSeconds[2]?.team.id || null) : null;
      }
      if (qf2) {
        qf2.homeId = isGroupCompleted('B') ? (standB[0]?.team.id || null) : null;
        qf2.awayId = allGroupsDone ? (bestSeconds[1]?.team.id || null) : null;
      }
      if (qf3) {
        qf3.homeId = isGroupCompleted('C') ? (standC[0]?.team.id || null) : null;
        qf3.awayId = allGroupsDone ? (bestSeconds[0]?.team.id || null) : null;
      }
      if (qf4) {
        qf4.homeId = isGroupCompleted('D') ? (standD[0]?.team.id || null) : null;
        qf4.awayId = isGroupCompleted('E') ? (standE[0]?.team.id || null) : null;
      }

      const sf1 = tournamentData.matches.find(m => m.id === 'sf1');
      const sf2 = tournamentData.matches.find(m => m.id === 'sf2');
      if (sf1) {
        sf1.homeId = getMatchWinnerId(qf1);
        sf1.awayId = getMatchWinnerId(qf3);
      }
      if (sf2) {
        sf2.homeId = getMatchWinnerId(qf2);
        sf2.awayId = getMatchWinnerId(qf4);
      }

      const fin = tournamentData.matches.find(m => m.id === 'final');
      if (fin) {
        fin.homeId = getMatchWinnerId(sf1);
        fin.awayId = getMatchWinnerId(sf2);
      }
    }

    function computeTopScorers() {
      const scorerMap = {};
      const teamPlayedMap = {};

      tournamentData.teams.forEach(t => {
        teamPlayedMap[t.id] = 0;
        t.players.forEach(p => {
          scorerMap[p.id] = {
            player: p,
            team: t,
            goals: 0
          };
        });
      });

      tournamentData.matches.forEach(m => {
        if ((m.status === 'FINISHED' || m.status === 'LIVE') && m.homeId && m.awayId) {
          teamPlayedMap[m.homeId] = (teamPlayedMap[m.homeId] || 0) + 1;
          teamPlayedMap[m.awayId] = (teamPlayedMap[m.awayId] || 0) + 1;
        }
        if (Array.isArray(m.goalEvents)) {
          m.goalEvents.forEach(ev => {
            if (ev.playerId && scorerMap[ev.playerId]) {
              scorerMap[ev.playerId].goals += 1;
            }
          });
        }
      });

      return Object.values(scorerMap)
        .filter(item => item.goals > 0)
        .map(item => {
          const pj = teamPlayedMap[item.team.id] || 1;
          return {
            ...item,
            pj,
            avg: (item.goals / pj).toFixed(2)
          };
        })
        .sort((a, b) => {
          if (b.goals !== a.goals) return b.goals - a.goals;
          return a.player.name.localeCompare(b.player.name);
        });
    }

    function bindCropCanvasEvents() {
      const canvas = document.getElementById('crop-preview-canvas');
      if (!canvas) return;

      canvas.onmousedown = (e) => {
        cropState.isDragging = true;
        cropState.dragStartX = e.clientX - cropState.offsetX;
        cropState.dragStartY = e.clientY - cropState.offsetY;
      };

      window.onmousemove = (e) => {
        if (!cropState.isDragging || !cropState.active) return;
        cropState.offsetX = Math.max(-400, Math.min(400, e.clientX - cropState.dragStartX));
        cropState.offsetY = Math.max(-400, Math.min(400, e.clientY - cropState.dragStartY));
        syncCropSliders();
        drawCropPreview();
      };

      window.onmouseup = () => {
        cropState.isDragging = false;
      };

      canvas.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.05 : -0.05;
        updateCropZoom(cropState.zoom + delta);
      };

      canvas.ontouchstart = (e) => {
        if (e.touches.length === 1) {
          cropState.isDragging = true;
          cropState.dragStartX = e.touches[0].clientX - cropState.offsetX;
          cropState.dragStartY = e.touches[0].clientY - cropState.offsetY;
        } else if (e.touches.length === 2) {
          cropState.isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          cropState.pinchStartDist = Math.hypot(dx, dy);
          cropState.pinchStartZoom = cropState.zoom;
        }
      };

      canvas.ontouchmove = (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && cropState.isDragging) {
          cropState.offsetX = Math.max(-400, Math.min(400, e.touches[0].clientX - cropState.dragStartX));
          cropState.offsetY = Math.max(-400, Math.min(400, e.touches[0].clientY - cropState.dragStartY));
          syncCropSliders();
          drawCropPreview();
        } else if (e.touches.length === 2 && cropState.pinchStartDist) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const ratio = dist / cropState.pinchStartDist;
          updateCropZoom(cropState.pinchStartZoom * ratio);
        }
      };

      canvas.ontouchend = () => {
        cropState.isDragging = false;
        cropState.pinchStartDist = null;
      };
    }

    function syncCropSliders() {
      const zSlider = document.getElementById('crop-zoom-slider');
      const zLabel = document.getElementById('crop-zoom-label');
      const xSlider = document.getElementById('crop-x-slider');
      const xLabel = document.getElementById('crop-x-label');
      const ySlider = document.getElementById('crop-y-slider');
      const yLabel = document.getElementById('crop-y-label');

      if (zSlider) zSlider.value = cropState.zoom;
      if (zLabel) zLabel.textContent = `${Math.round(cropState.zoom * 100)}%`;
      if (xSlider) xSlider.value = cropState.offsetX;
      if (xLabel) xLabel.textContent = `${Math.round(cropState.offsetX)} px`;
      if (ySlider) ySlider.value = cropState.offsetY;
      if (yLabel) yLabel.textContent = `${Math.round(cropState.offsetY)} px`;
    }

    function nudgeCropZoom(delta) {
      updateCropZoom(Number(cropState.zoom) + delta);
    }

    function updateCropZoom(val) {
      cropState.zoom = Math.max(0.05, Math.min(6.0, Number(val)));
      syncCropSliders();
      drawCropPreview();
    }

    function updateCropOffset(axis, val) {
      const num = Math.max(-400, Math.min(400, Number(val)));
      if (axis === 'x') cropState.offsetX = num;
      if (axis === 'y') cropState.offsetY = num;
      syncCropSliders();
      drawCropPreview();
    }

    function applyCropPreset(mode) {
      const img = cropState.imgElement;
      if (!img) return;
      const canvasDim = 240;
      if (mode === 'fit') {
        cropState.zoom = Math.max(0.05, Math.min(6.0, Math.min(canvasDim / img.width, canvasDim / img.height)));
        cropState.offsetX = 0;
        cropState.offsetY = 0;
      } else if (mode === 'fill') {
        cropState.zoom = Math.max(0.05, Math.min(6.0, Math.max(canvasDim / img.width, canvasDim / img.height)));
        cropState.offsetX = 0;
        cropState.offsetY = 0;
      } else if (mode === 'center') {
        cropState.offsetX = 0;
        cropState.offsetY = 0;
      }
      syncCropSliders();
      drawCropPreview();
    }

    function drawCropPreview() {
      const canvas = document.getElementById('crop-preview-canvas');
      const img = cropState.imgElement;
      if (!canvas || !img) return;
      const ctx = canvas.getContext('2d');
      const dim = canvas.width;

      ctx.clearRect(0, 0, dim, dim);

      if (cropState.bgMode !== 'transparent') {
        ctx.fillStyle = cropState.bgMode;
        ctx.fillRect(0, 0, dim, dim);
      }

      const drawW = img.width * cropState.zoom;
      const drawH = img.height * cropState.zoom;
      const drawX = (dim - drawW) / 2 + cropState.offsetX;
      const drawY = (dim - drawH) / 2 + cropState.offsetY;

      ctx.drawImage(img, drawX, drawY, drawW, drawH);
    }

    function saveCroppedImage() {
      const img = cropState.imgElement;
      if (!img) return;

      const outSize = cropState.outputSize || 256;
      const previewDim = 240;
      const ratio = outSize / previewDim;

      const outCanvas = document.createElement('canvas');
      outCanvas.width = outSize;
      outCanvas.height = outSize;
      const ctx = outCanvas.getContext('2d');

      if (cropState.bgMode !== 'transparent') {
        ctx.fillStyle = cropState.bgMode;
        ctx.fillRect(0, 0, outSize, outSize);
      }

      const drawW = img.width * cropState.zoom * ratio;
      const drawH = img.height * cropState.zoom * ratio;
      const drawX = (outSize - drawW) / 2 + cropState.offsetX * ratio;
      const drawY = (outSize - drawH) / 2 + cropState.offsetY * ratio;

      ctx.drawImage(img, drawX, drawY, drawW, drawH);

      const finalDataUrl = cropState.bgMode === 'transparent'
        ? outCanvas.toDataURL('image/png')
        : outCanvas.toDataURL('image/jpeg', 0.88);

      if (cropState.targetType === 'headerCrest') {
        tournamentData.customHeaderCrestUrl = finalDataUrl;
        saveTournamentData({ saveMain: true });
        showToast('Escudo principal del header actualizado', 'success');
      } else if (cropState.targetType === 'teamCrest') {
        const team = getTeamById(cropState.targetId);
        if (team) {
          team.customCrestUrl = finalDataUrl;
          saveTournamentData({ saveMain: false, teamId: team.id });
          showToast(`Escudo de ${team.name} actualizado`, 'success');
        }
      } else if (cropState.targetType === 'playerPhoto') {
        const team = getTeamById(uiState.adminSelectedTeamId);
        const player = team?.players.find(p => p.id === cropState.targetId);
        if (player && team) {

    function batchResizeAllImages() {
      const maxDim = Number(document.getElementById('batch-max-dim')?.value || 160);
      const quality = Number(document.getElementById('batch-quality')?.value || 0.82);

      const tasks = [];

      const resizeDataUrl = (dataUrl, keepAlpha) => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = maxDim;
          canvas.height = maxDim;
          const ctx = canvas.getContext('2d');
          const scale = Math.min(maxDim / img.width, maxDim / img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          ctx.drawImage(img, (maxDim - w) / 2, (maxDim - h) / 2, w, h);
          resolve(keepAlpha ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });

      if (tournamentData.customHeaderCrestUrl) {
        tasks.push(
          resizeDataUrl(tournamentData.customHeaderCrestUrl, true).then(res => {
            tournamentData.customHeaderCrestUrl = res;
          })
        );
      }

      tournamentData.teams.forEach(t => {
        if (t.customCrestUrl) {
          tasks.push(
            resizeDataUrl(t.customCrestUrl, true).then(res => {
              t.customCrestUrl = res;
            })
          );
        }
        t.players.forEach(p => {
          if (p.photoUrl) {
            tasks.push(
              resizeDataUrl(p.photoUrl, false).then(res => {
                p.photoUrl = res;
              })
            );
          }
        });
      });

      if (tasks.length === 0) {
        showToast('No hay imágenes personalizadas cargadas para reajustar', 'info');
        return;
      }

      Promise.all(tasks).then(() => {
        saveTournamentData({ saveMain: true, saveAllTeams: true });
        showToast(`Se reajustaron ${tasks.length} imágenes a ${maxDim}×${maxDim} px`, 'success');
        renderApp();
      });
    }

    function confirmAddGoal(matchId, side, playerId) {
      const match = tournamentData.matches.find(m => m.id === matchId);
      if (!match) return;
      if (match.status === 'SCHEDULED') {
        match.status = 'LIVE';
      }
      if (match.homeGoals === null) match.homeGoals = 0;
      if (match.awayGoals === null) match.awayGoals = 0;

      const teamId = side === 'home' ? match.homeId : match.awayId;
      if (side === 'home') match.homeGoals += 1;
      else match.awayGoals += 1;

      match.goalEvents.push({ teamId, playerId: playerId || null });

      syncKnockoutBracket();
      saveTournamentData();
      closeModal();
      showToast('Gol registrado en el marcador', 'success');
      renderApp();
    }

    function removeLastGoal(matchId, side) {
      const match = tournamentData.matches.find(m => m.id === matchId);
      if (!match) return;
      const teamId = side === 'home' ? match.homeId : match.awayId;

      if (side === 'home' && (match.homeGoals || 0) > 0) {
        match.homeGoals -= 1;
      } else if (side === 'away' && (match.awayGoals || 0) > 0) {
        match.awayGoals -= 1;
      } else {
        return;
      }

      for (let i = match.goalEvents.length - 1; i >= 0; i--) {
        if (match.goalEvents[i].teamId === teamId) {
          match.goalEvents.splice(i, 1);
          break;
        }
      }

      syncKnockoutBracket();
      saveTournamentData();
      showToast('Se descontó un gol', 'info');
      renderApp();
    }

    function simulateGroupStage() {
      // Si el fixture de grupos está vacío, generamos los partidos base primero
      const existingGroupMatches = tournamentData.matches.filter(m => m.stage === 'GROUP');
      if (existingGroupMatches.length === 0) {
        const baseTimes = ['09:00', '09:45', '10:30', '11:15', '12:00', '12:45', '13:30', '14:15', '15:00', '15:45', '16:30', '17:15', '18:00', '18:45', '19:30'];
        let tIdx = 0;
        TOURNAMENT_GROUPS.forEach(g => {
          const gTeams = tournamentData.teams.filter(t => t.group === g);
          if (gTeams.length >= 2) {
            const pairs = [];
            for (let i = 0; i < gTeams.length; i++) {
              for (let j = i + 1; j < gTeams.length; j++) {
                pairs.push([gTeams[i].id, gTeams[j].id, pairs.length + 1]);
              }
            }
            pairs.forEach(([hId, aId, rnd]) => {
              tournamentData.matches.unshift({
                id: 'm_sim_' + g + '_' + rnd + '_' + Math.random().toString(36).slice(2, 6),
                stage: 'GROUP',
                group: g,
                round: rnd,
                day: 'Sábado',
                time: baseTimes[tIdx % baseTimes.length],
                pitch: (tIdx % 2 === 0) ? 'Cancha 1' : 'Cancha 2',
                homeId: hId,
                awayId: aId,
                homeGoals: null,
                awayGoals: null,
                status: 'SCHEDULED',
                goalEvents: []
              });
              tIdx += 1;
            });
          }
        });
      }

      tournamentData.matches.forEach(m => {
        if (m.stage === 'GROUP' && m.status !== 'FINISHED') {
          const homeT = getTeamById(m.homeId);
          const awayT = getTeamById(m.awayId);
          const hg = Math.floor(Math.random() * 4);
          const ag = Math.floor(Math.random() * 4);
          m.homeGoals = hg;
          m.awayGoals = ag;
          m.status = 'FINISHED';
          m.goalEvents = [];

          for (let i = 0; i < hg; i++) {
            const p = homeT?.players[Math.floor(Math.random() * homeT.players.length)];
            m.goalEvents.push({ teamId: m.homeId, playerId: p ? p.id : null });
          }
          for (let i = 0; i < ag; i++) {
            const p = awayT?.players[Math.floor(Math.random() * awayT.players.length)];
            m.goalEvents.push({ teamId: m.awayId, playerId: p ? p.id : null });
          }
        }
      });

      syncKnockoutBracket();
      saveTournamentData();
      showToast('Fase de grupos simulada y cuartos armados', 'success');
      renderApp();
    }

    function getFiveMinuteTimeOptions(selectedTime = '09:00') {
      const options = [];
      for (let h = 8; h <= 23; h++) {
        for (let m = 0; m < 60; m += 5) {
          const hh = String(h).padStart(2, '0');
          const mm = String(m).padStart(2, '0');
          const val = `${hh}:${mm}`;
          options.push(`<option value="${val}" ${val === selectedTime ? 'selected' : ''}>${val} hs</option>`);
        }
      }
      return options.join('');
    }

    function addManualFixtureMatch(e) {
      e.preventDefault();
      const group = uiState.newMatchGroup;
      const homeId = uiState.newMatchHomeId;
      const awayId = uiState.newMatchAwayId;
      const day = uiState.newMatchDay || 'Sábado';
      const time = uiState.newMatchTime || '09:00';
      const pitch = (uiState.newMatchPitch || 'Cancha 1').trim();

      if (!group || !homeId || !awayId) {
        showToast('Seleccioná grupo, equipo local y equipo visitante', 'error');
        return;
      }
      if (homeId === awayId) {
        showToast('El equipo local y el visitante no pueden ser el mismo', 'error');
        return;
      }

      const existingInGroup = tournamentData.matches.filter(m => m.stage === 'GROUP' && m.group === group);
      const duplicatePair = existingInGroup.find(
        m => (m.homeId === homeId && m.awayId === awayId) || (m.homeId === awayId && m.awayId === homeId)
      );
      if (duplicatePair) {
        showToast('Ese cruce ya está programado en este grupo', 'error');
        return;
      }

      const newMatch = {
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        stage: 'GROUP',
        group,
        round: existingInGroup.length + 1,
        day,
        time,
        pitch: pitch || 'Cancha 1',
        homeId,
        awayId,
        homeGoals: null,
        awayGoals: null,
        status: 'SCHEDULED',
        goalEvents: []
      };

      const groupMatches = [...tournamentData.matches.filter(m => m.stage === 'GROUP'), newMatch];
      groupMatches.sort((a, b) => {
        if (a.day !== b.day) return a.day.localeCompare(b.day);
        return a.time.localeCompare(b.time);
      });
      const knockoutMatches = tournamentData.matches.filter(m => m.stage !== 'GROUP');
      tournamentData.matches = [...groupMatches, ...knockoutMatches];

      syncKnockoutBracket();
      saveTournamentData();
      showToast(`Partido agregado al Grupo ${group} (${time} hs)`, 'success');
      renderApp();
    }

      match[field] = value;

      if (match.stage === 'GROUP') {
        const groupMatches = tournamentData.matches.filter(m => m.stage === 'GROUP');
        groupMatches.sort((a, b) => {
          if (a.day !== b.day) return a.day.localeCompare(b.day);
          return a.time.localeCompare(b.time);
        });
        const knockoutMatches = tournamentData.matches.filter(m => m.stage !== 'GROUP');
        tournamentData.matches = [...groupMatches, ...knockoutMatches];
      }

      saveTournamentData();
      showToast('Horario / cancha actualizado', 'success');
      renderApp();
    }

    function handleImportJsonFile(e) {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.teams) || !Array.isArray(parsed.matches)) {
            throw new Error('Formato inválido');
          }
          tournamentData = parsed;
          syncKnockoutBracket();
          saveTournamentData({ saveMain: true, saveAllTeams: true });
          showToast('Datos importados correctamente', 'success');
          renderApp();
        } catch (err) {
          showToast('El archivo JSON no es válido', 'error');
        }
      };
      reader.readAsText(file);
    }

            onclick="uiState.activeTab = '${t.id}'; renderApp();"

                              <td class="py-2.5 px-2">

                </div>

          </div>

          <!-- Tabla Extra: Mejores Segundos (Clasifican 3 de 5) -->
          <div class="bg-white rounded-2xl border-2 border-[#009EE3] shadow-sm overflow-hidden">
            <div class="bg-[#0F172A] text-white px-4 sm:px-5 py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b-2 border-[#009EE3]">
              <div class="flex items-center gap-2.5">

                <div>
                  <h3 class="font-sport text-lg sm:text-xl font-bold uppercase tracking-wide">Tabla de Mejores Segundos</h3>
                  <p class="text-[11px] text-slate-300">Los <strong>3 mejores segundos</strong> avanzan a Cuartos de Final una vez completados los 5 grupos.</p>

              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${allGroupsDone ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-white/10 text-sky-200'}">

              </span>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">

                  <tr class="bg-slate-50 text-[11px] font-extrabold uppercase text-slate-500 border-b border-slate-200">
                    <th class="py-2.5 pl-4 pr-1 w-10 text-center">#</th>
                    <th class="py-2.5 px-2 w-16 text-center">Zona</th>
                    <th class="py-2.5 px-2">Equipo (2° de Grupo)</th>
                    <th class="py-2.5 px-2 text-center text-slate-900">PTS</th>
                    <th class="py-2.5 px-1.5 text-center">PJ</th>
                    <th class="py-2.5 px-1.5 text-center">PG</th>
                    <th class="py-2.5 px-1.5 text-center">PE</th>
                    <th class="py-2.5 px-1.5 text-center">PP</th>
                    <th class="py-2.5 px-1.5 text-center hidden sm:table-cell">GF</th>
                    <th class="py-2.5 px-1.5 text-center hidden sm:table-cell">GC</th>
                    <th class="py-2.5 px-2 text-center">DIF</th>
                    <th class="py-2.5 pl-2 pr-4 text-right">Estado</th>

                </thead>
                <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                  ${bestSeconds.map((r, idx) => {
                    const qualifies = idx < 3;
                    return `
                      <tr class="${qualifies ? 'bg-[#E0F5FE]/55' : 'hover:bg-slate-50'} transition-colors">
                        <td class="py-3 pl-4 pr-1 text-center">
                          <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg text-xs font-extrabold ${
                            qualifies ? 'bg-[#009EE3] text-white' : 'bg-slate-200 text-slate-600'
                          }">
                            ${idx + 1}
                          </span>

                        <td class="py-3 px-2 text-center">
                          <span class="px-2 py-0.5 rounded-md bg-slate-900 text-white font-sport text-xs font-bold">
                            Grupo ${r.group}
                          </span>
                        </td>
                        <td class="py-3 px-2">

                          </div>
                        </td>
                        <td class="py-3 px-2 text-center font-extrabold text-slate-900">${r.pts}</td>
                        <td class="py-3 px-1.5 text-center text-slate-600">${r.pj}</td>
                        <td class="py-3 px-1.5 text-center text-slate-600">${r.pg}</td>
                        <td class="py-3 px-1.5 text-center text-slate-600">${r.pe}</td>
                        <td class="py-3 px-1.5 text-center text-slate-600">${r.pp}</td>
                        <td class="py-3 px-1.5 text-center text-slate-500 hidden sm:table-cell">${r.gf}</td>
                        <td class="py-3 px-1.5 text-center text-slate-500 hidden sm:table-cell">${r.gc}</td>
                        <td class="py-3 px-2 text-center font-bold ${

                              </span>`
                            : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500">

    function renderFixtureView() {
      const searchLower = uiState.fixtureSearch.trim().toLowerCase();

      const filtered = tournamentData.matches.filter(m => {
        if (uiState.fixtureDay !== 'ALL' && m.day !== uiState.fixtureDay) return false;
        if (uiState.fixtureGroup !== 'ALL') {
          if (uiState.fixtureGroup === 'KNOCKOUT') {
            if (m.stage === 'GROUP') return false;
          } else if (m.group !== uiState.fixtureGroup) {
            return false;
          }
        }
        if (searchLower) {
          const homeName = (getTeamById(m.homeId)?.name || m.seedHome || '').toLowerCase();
          const awayName = (getTeamById(m.awayId)?.name || m.seedAway || '').toLowerCase();
          if (!homeName.includes(searchLower) && !awayName.includes(searchLower)) return false;
        }
        return true;
      });

      return `
        <div class="space-y-5">
          <div>
            <h2 class="font-sport text-2xl sm:text-3xl font-bold uppercase text-slate-900">Fixture y Resultados</h2>
            <p class="text-xs sm:text-sm text-slate-500">Consultá el horario de tus partidos.</p>
          </div>

          <!-- Filtros -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs flex flex-col md:flex-row gap-3">
            <div class="flex flex-wrap gap-1.5">
              ${['ALL', 'Sábado', 'Domingo'].map(d => `
                <button
                  type="button"
                  onclick="uiState.fixtureDay='${d}'; renderApp();"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold transition-colors ${
                    uiState.fixtureDay === d ? 'bg-[#009EE3] text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }"
                >
                  ${d === 'ALL' ? 'Todos los días' : d}
                </button>
              `).join('')}
            </div>

            <select
              onchange="uiState.fixtureGroup=this.value; renderApp();"
              class="px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700"
            >
              <option value="ALL" ${uiState.fixtureGroup === 'ALL' ? 'selected' : ''}>Todas las Zonas / Instancias</option>
              <option value="A" ${uiState.fixtureGroup === 'A' ? 'selected' : ''}>Grupo A</option>
              <option value="B" ${uiState.fixtureGroup === 'B' ? 'selected' : ''}>Grupo B</option>
              <option value="C" ${uiState.fixtureGroup === 'C' ? 'selected' : ''}>Grupo C</option>
              <option value="D" ${uiState.fixtureGroup === 'D' ? 'selected' : ''}>Grupo D</option>
              <option value="E" ${uiState.fixtureGroup === 'E' ? 'selected' : ''}>Grupo E</option>
              <option value="KNOCKOUT" ${uiState.fixtureGroup === 'KNOCKOUT' ? 'selected' : ''}>Fase Final (Domingo)</option>
            </select>

            <input
              type="text"
              value="${escapeHtml(uiState.fixtureSearch)}"
              oninput="uiState.fixtureSearch=this.value; renderApp();"
              placeholder="Buscar equipo..."
              class="flex-1 px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-medium focus:border-[#009EE3] focus:outline-none"
            />
          </div>

          <!-- Listado de Partidos -->
          ${filtered.length === 0
            ? `<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-500 text-sm">
                No se encontraron partidos con los filtros seleccionados.
              </div>`
            : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${filtered.map(m => renderMatchCard(m)).join('')}
              </div>`
          }
        </div>
      `;
    }

    function renderMatchCard(m) {
      const homeTeam = getTeamById(m.homeId);
      const awayTeam = getTeamById(m.awayId);
      const stageBadge = m.stage === 'GROUP' ? `Grupo ${m.group}` : m.label;

      let statusHtml = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">Programado</span>`;
      if (m.status === 'LIVE') {
        statusHtml = `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-100 text-red-700"><span class="w-1.5 h-1.5 rounded-full bg-red-600 live-dot"></span> En Juego</span>`;
      } else if (m.status === 'FINISHED') {
        statusHtml = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">Finalizado</span>`;
      }

      const scorersSummary = (m.goalEvents || [])
        .map(ev => {
          const p = getPlayerById(ev.teamId, ev.playerId);
          return p ? p.name : null;
        })
        .filter(Boolean);

      return `
        <div class="bg-white rounded-2xl border ${m.status === 'LIVE' ? 'border-red-300 ring-2 ring-red-100' : 'border-slate-200'} p-4 shadow-2xs flex flex-col justify-between gap-3">
          <div class="flex items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-md bg-[#0F172A] text-white font-sport uppercase tracking-wide">${escapeHtml(stageBadge)}</span>
              <span class="text-slate-500 font-semibold">${escapeHtml(m.day)} • ${escapeHtml(m.time)} • ${escapeHtml(m.pitch)}</span>
            </div>
            ${statusHtml}
          </div>

          <div class="grid grid-cols-11 items-center gap-2 py-1">
            <div class="col-span-4 flex flex-col items-center text-center gap-1.5">
              ${renderTeamCrest(homeTeam, 38)}
              <span class="font-bold text-xs sm:text-sm text-slate-900 line-clamp-2 leading-tight">
                ${escapeHtml(homeTeam ? homeTeam.name : m.seedHome)}
              </span>
            </div>

            <div class="col-span-3 flex flex-col items-center justify-center">
              ${m.status === 'SCHEDULED'
                ? `<span class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 font-sport text-lg font-bold">VS</span>`
                : `<div class="px-3 py-1.5 rounded-xl bg-[#0F172A] text-white font-sport text-2xl font-bold tracking-wider">
                    ${m.homeGoals} - ${m.awayGoals}
                  </div>`
              }
              ${m.homePen !== null && m.awayPen !== null
                ? `<span class="text-[11px] font-bold text-[#0077B6] mt-1">Penales: ${m.homePen} - ${m.awayPen}</span>`
                : ''
              }
            </div>

            <div class="col-span-4 flex flex-col items-center text-center gap-1.5">
              ${renderTeamCrest(awayTeam, 38)}
              <span class="font-bold text-xs sm:text-sm text-slate-900 line-clamp-2 leading-tight">
                ${escapeHtml(awayTeam ? awayTeam.name : m.seedAway)}
              </span>
            </div>
          </div>

          ${scorersSummary.length > 0
            ? `<div class="pt-2 border-t border-slate-100 text-[11px] text-slate-500 flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-slate-700">⚽ Goles:</span>
                <span>${escapeHtml(scorersSummary.join(', '))}</span>
              </div>`
            : ''
          }
        </div>
      `;
    }

    function renderKnockoutView() {
      const qfs = tournamentData.matches.filter(m => m.stage === 'QF');
      const sfs = tournamentData.matches.filter(m => m.stage === 'SF');
      const fin = tournamentData.matches.find(m => m.stage === 'FINAL');
      const championId = getMatchWinnerId(fin);
      const championTeam = getTeamById(championId);

      const renderBracketCard = (m, highlight = false) => {
        const homeT = getTeamById(m.homeId);
        const awayT = getTeamById(m.awayId);
        const winId = getMatchWinnerId(m);

        return `
          <div class="bg-white rounded-2xl border ${highlight ? 'border-2 border-[#009EE3] shadow-md' : 'border-slate-200 shadow-2xs'} p-3.5 space-y-2.5">
            <div class="flex items-center justify-between text-[11px] font-bold text-slate-500">
              <span class="uppercase text-[#0077B6]">${escapeHtml(m.label)}</span>
              <span>${escapeHtml(m.time)} • ${escapeHtml(m.pitch)}</span>
            </div>

            <div class="space-y-1.5">
              <div class="flex items-center justify-between gap-2 p-2 rounded-xl ${winId && winId === m.homeId ? 'bg-[#E0F5FE] font-extrabold' : 'bg-slate-50'}">
                <div class="flex items-center gap-2 min-w-0">
                  ${renderTeamCrest(homeT, 24)}
                  <span class="text-xs sm:text-sm truncate ${homeT ? 'text-slate-900 font-bold' : 'text-slate-400 italic'}">
                    ${escapeHtml(homeT ? homeT.name : m.seedHome)}
                  </span>
                </div>
                <span class="font-sport text-base font-bold text-slate-900 shrink-0">
                  ${m.homeGoals !== null ? m.homeGoals : '-'}${m.homePen !== null ? ` (${m.homePen})` : ''}
                </span>
              </div>

              <div class="flex items-center justify-between gap-2 p-2 rounded-xl ${winId && winId === m.awayId ? 'bg-[#E0F5FE] font-extrabold' : 'bg-slate-50'}">
                <div class="flex items-center gap-2 min-w-0">
                  ${renderTeamCrest(awayT, 24)}
                  <span class="text-xs sm:text-sm truncate ${awayT ? 'text-slate-900 font-bold' : 'text-slate-400 italic'}">
                    ${escapeHtml(awayT ? awayT.name : m.seedAway)}
                  </span>
                </div>
                <span class="font-sport text-base font-bold text-slate-900 shrink-0">
                  ${m.awayGoals !== null ? m.awayGoals : '-'}${m.awayPen !== null ? ` (${m.awayPen})` : ''}
                </span>
              </div>
            </div>
          </div>
        `;
      };

      return `
        <div class="space-y-6">
          <div>
            <h2 class="font-sport text-2xl sm:text-3xl font-bold uppercase text-slate-900">Fase Final — Eliminación Directa</h2>
            <p class="text-xs sm:text-sm text-slate-500">Cada llave de Cuartos se habilita únicamente cuando finalizan todos los partidos de su zona.</p>
          </div>

          ${championTeam ? `
            <div class="bg-gradient-to-r from-[#0F172A] via-[#0369A1] to-[#009EE3] text-white rounded-2xl p-6 shadow-xl border-2 border-sky-300 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                ${renderTeamCrest(championTeam, 64)}
                <div>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold uppercase bg-amber-400 text-slate-950">🏆 Campeón del Torneo</span>
                  <h3 class="font-sport text-2xl sm:text-4xl font-bold uppercase mt-1">${escapeHtml(championTeam.name)}</h3>
                  <p class="text-xs sm:text-sm text-sky-100">Torneo Interno de Socios • Club Atlético Temperley</p>
                </div>
              </div>
            </div>
          ` : ''}

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
            <div class="space-y-3">
              <h3 class="font-sport text-lg font-bold uppercase text-slate-700 px-1">Cuartos de Final</h3>
              ${qfs.map(m => renderBracketCard(m)).join('')}
            </div>

            <div class="space-y-4">
              <h3 class="font-sport text-lg font-bold uppercase text-slate-700 px-1">Semifinales</h3>
              ${sfs.map(m => renderBracketCard(m)).join('')}
            </div>

            <div class="space-y-3">
              <h3 class="font-sport text-lg font-bold uppercase text-[#0077B6] px-1">Gran Final</h3>
              ${fin ? renderBracketCard(fin, true) : ''}
            </div>
          </div>
        </div>
      `;

                    ${tournamentData.customHeaderCrestUrl ? `
                      <div class="p-2.5 rounded-xl border border-slate-200 bg-slate-50 flex flex-col items-center gap-2 text-center">
                        <img src="${tournamentData.customHeaderCrestUrl}" class="w-14 h-14 object-contain rounded-lg bg-[#0F172A] p-1" />
                        <span class="text-[11px] font-bold text-slate-800 truncate w-full">Escudo Header</span>
                        <button type="button" onclick="openImageCropModal({ targetType: 'headerCrest', title: 'Reajustar Escudo Header', rawImageSrc: tournamentData.customHeaderCrestUrl })" class="w-full py-1 rounded-lg bg-[#009EE3] text-white text-[11px] font-bold">
                          ✂️ Reajustar
                        </button>
                      </div>
                    ` : ''}
                    ${customTeams.map(t => `
                      <div class="p-2.5 rounded-xl border border-slate-200 bg-slate-50 flex flex-col items-center gap-2 text-center">
                        <img src="${t.customCrestUrl}" class="w-14 h-14 object-contain rounded-lg bg-white p-1 border border-slate-200" />
                        <span class="text-[11px] font-bold text-slate-800 truncate w-full">${escapeHtml(t.name)}</span>
                        <button type="button" onclick="openImageCropModal({ targetType: 'teamCrest', targetId: '${t.id}', title: 'Reajustar Escudo • ${escapeHtml(t.name)}', rawImageSrc: getTeamById('${t.id}').customCrestUrl })" class="w-full py-1 rounded-lg bg-[#009EE3] text-white text-[11px] font-bold">
                          ✂️ Reajustar
                        </button>
                      </div>
                    `).join('')}
                    ${customPlayers.map(({ team, player }) => `
                      <div class="p-2.5 rounded-xl border border-slate-200 bg-slate-50 flex flex-col items-center gap-2 text-center">
                        <img src="${player.photoUrl}" class="w-14 h-14 object-cover rounded-full border border-slate-300" />
                        <span class="text-[11px] font-bold text-slate-800 truncate w-full">${escapeHtml(player.name)}</span>
                        <button type="button" onclick="uiState.adminSelectedTeamId='${team.id}'; openImageCropModal({ targetType: 'playerPhoto', targetId: '${player.id}', title: 'Encuadrar Foto • ${escapeHtml(player.name)}', rawImageSrc: '${player.photoUrl}', bgMode: '#ffffff', outputSize: 200 })" class="w-full py-1 rounded-lg bg-[#009EE3] text-white text-[11px] font-bold">
                          ✂️ Reajustar
                        </button>
                      </div>
                    `).join('')}
                  </div>`
              }
            </div>
          </div>
        `;
      } else if (uiState.adminSubTab === 'controles') {
        subContentHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs space-y-3">
              <h3 class="font-sport text-xl font-bold uppercase text-slate-900">Simulación Rápida</h3>
              <p class="text-xs text-slate-500">Completá automáticamente los partidos de los 5 grupos con resultados y goleadores aleatorios para probar la tabla de mejores segundos y los cruces de cuartos.</p>
              <button type="button" onclick="simulateGroupStage()" class="px-4 py-2.5 rounded-xl bg-[#009EE3] hover:bg-[#0077B6] text-white font-bold text-xs sm:text-sm">
                ⚡ Simular Fase de Grupos
              </button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs space-y-3">
              <h3 class="font-sport text-xl font-bold uppercase text-slate-900">Respaldo y Reinicio</h3>
              <p class="text-xs text-slate-500">Exportá una copia completa del torneo (incluyendo resultados, escudos y fotos) o reiniciá todos los datos a cero.</p>
              <div class="flex flex-wrap gap-2">
                <button type="button" onclick="exportTournamentJson()" class="px-3.5 py-2 rounded-xl bg-[#0F172A] text-white font-bold text-xs">
                  ⬇️ Exportar JSON
                </button>
                <button type="button" onclick="document.getElementById('import-json-input').click()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs">
                  ⬆️ Importar JSON
                </button>
                <button type="button" onclick="resetTournamentData()" class="px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs">
                  🗑️ Reiniciar Torneo
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-5">
          <div class="bg-[#0F172A] text-white rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b-4 border-[#009EE3]">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-[#009EE3]">Modo Planillero Activo</span>
              <h2 class="font-sport text-2xl font-bold uppercase">Panel de Administración del Torneo</h2>
            </div>
            <button type="button" onclick="logoutAdmin()" class="self-start sm:self-auto px-4 py-2 rounded-xl bg-red-500/20 hover:bg-red-500/30 border border-red-400/40 text-red-200 text-xs font-bold">
              🔒 Salir y Ocultar Admin
            </button>
          </div>

          <div class="flex flex-wrap gap-2">
            ${[
              { id: 'fixture', label: '📅 Armar Fixture' },
              { id: 'resultados', label: '⚡ Resultados' },
              { id: 'equipos', label: '🛡️ Equipos, Escudos y Fotos' },
              { id: 'imagenes', label: '📐 Tamaño y Ajuste de Imágenes' },
              { id: 'controles', label: '⚙️ Simulación y Respaldo' }
            ].map(st => `
              <button
                type="button"
                onclick="uiState.adminSubTab = '${st.id}'; renderApp();"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                  uiState.adminSubTab === st.id
                    ? 'bg-[#0F172A] text-white shadow-2xs'
                    : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'
                }"
              >
                ${st.label}
              </button>
            `).join('')}
          </div>

          ${subContentHtml}
        </div>
      `;
    }

    // -------------------------------------------------------------------
    // 11. RENDER PRINCIPAL E INICIALIZACIÓN
    // -------------------------------------------------------------------
    function renderApp() {
      syncKnockoutBracket();

      const headerBtn = document.getElementById('header-crest-btn');
      if (headerBtn) headerBtn.innerHTML = renderMainHeaderCrest();

      const footerWrap = document.getElementById('footer-crest-wrap');
      if (footerWrap) footerWrap.innerHTML = renderTemperleyCrestSVG('w-full h-full');

      const hasLive = tournamentData.matches.some(m => m.status === 'LIVE');
      const liveBadge = document.getElementById('live-header-badge');
      if (liveBadge) {
        if (hasLive) {
          liveBadge.classList.remove('hidden');
          liveBadge.classList.add('inline-flex');
        } else {
          liveBadge.classList.add('hidden');
          liveBadge.classList.remove('inline-flex');
        }
      }

      renderNavigation();

      const main = document.getElementById('app-content');
      if (!main) return;

      if (uiState.activeTab === 'posiciones') {
        main.innerHTML = renderStandingsView();
      } else if (uiState.activeTab === 'fixture') {
        main.innerHTML = renderFixtureView();
      } else if (uiState.activeTab === 'fase-final') {
        main.innerHTML = renderKnockoutView();
      } else if (uiState.activeTab === 'goleadores') {
        main.innerHTML = renderScorersView();
      } else if (uiState.activeTab === 'admin' && uiState.adminUnlocked) {
        main.innerHTML = renderAdminView();
      } else {
        uiState.activeTab = 'posiciones';
        main.innerHTML = renderStandingsView();
      }
    }

    // Exponer estado y manejadores globales para eventos inline del DOM
    Object.assign(window, {
      uiState,
      tournamentData,
      renderApp,
      getTeamById,
      handleSecretTriggerTap,
      openAdminPinModal,
      submitAdminPin,
      logoutAdmin,
      closeModal,
      startImageUpload,
      openImageCropModal,
      applyCropPreset,
      nudgeCropZoom,
      updateCropZoom,
      updateCropOffset,
      saveCroppedImage,
      updateGlobalImageSetting,
      resetGlobalImageSettings,
      batchResizeAllImages,
      resetCustomHeaderCrest,
      resetTeamCrest,
      updateGenericCrestProp,
      clearPlayerPhoto,
      setMatchStatus,
      openGoalModal,
      confirmAddGoal,
      removeLastGoal,
      updateKnockoutPenalty,
      updateTeamName,
      createNewTeam,
      updateTeamGroup,
      deleteTeam,
      addPlayerToTeam,
      removePlayerFromTeam,
      simulateGroupStage,
      onNewMatchGroupChange,
      addManualFixtureMatch,
      updateMatchScheduleField,
      swapFixtureMatchSides,
      deleteFixtureMatch,
      clearAllGroupFixtures,
      resetTournamentData,
      exportTournamentJson,
      handleImportJsonFile
    });

    window.onload = async function () {
      renderApp();
      checkUrlAdminTrigger();
      await initCloudSync();
    };
  </script>
</body>
</html>
